<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme');
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta && (storedScheme === 'light' || storedScheme === 'dark')) {
          meta.content = storedScheme;
          document.documentElement.setAttribute('data-theme', storedScheme);
        }
      } catch {}
    </script>
    <title>Inicio | Cursada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
